name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (Windows, 3.12)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CREWAI_STORAGE_DIR: ${{ github.workspace }}/.crewai
      OTEL_SDK_DISABLED: 'true'
      CREWAI_TELEMETRY_ENABLED: 'false'
      CREWAI_TRACING_ENABLED: 'false'
      PYTHONUTF8: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install application and test dependencies
        run: python -m pip install -e ".[test]" --no-compile
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run offline Python tests
        run: python -B -m unittest discover -s tests -v

  frontend:
    name: Frontend tests and build (Node 26)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Check TypeScript and build
        run: npm run build
